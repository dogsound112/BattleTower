<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COBBLEVERSE 배틀타워</title>
  <meta name="description" content="Cobblemon Battle Tower 1~50층 트레이너 파티 정보" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">COBBLEMON BATTLE TOWER</p>
        <h1>배틀타워 1~50층 트레이너 정보</h1>
        <p id="formatText" class="subtitle">불러오는 중...</p>
      </div>
      <div class="rule-stack">
        <div class="rule-card">
          <span class="rule-label">CHECKPOINT</span>
          <p id="checkpointText">불러오는 중...</p>
        </div>
        <div class="rule-card rest-rule">
          <span class="rule-label">REST AREA</span>
          <p id="restText">불러오는 중...</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="floor-selectors">
        <div class="range-nav" id="rangeNav"></div>
        <div class="floor-nav" id="floorNav"></div>
      </div>
      <label class="search">
        <span>검색</span>
        <input id="searchInput" type="search" placeholder="포켓몬 / 기술 / 특성 / 도구 검색" />
      </label>
    </section>

    <section id="floorHeader" class="floor-header"></section>
    <section id="teamGrid" class="team-grid"></section>
    <p id="emptyMessage" class="empty" hidden>검색 결과가 없습니다.</p>
  </main>

  <footer>
    <p>COBBLEVERSE · Battle Tower Database</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
